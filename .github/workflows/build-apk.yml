name: Build Oplus Assistant Hook APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 缓存 Gradle
        uses: gradle/gradle-build-action@v3

      - name: 编译 Debug APK（推荐测试用）
        run: ./gradlew assembleDebug

      # 可选：同时编译 Release 版
      # - name: 编译 Release APK
      #   run: ./gradlew assembleRelease

      - name: 上传 APK（Debug）
        uses: actions/upload-artifact@v4
        with:
          name: Oplus-Assistant-Hook-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 如果你编译了 Release，也可以加上
      # - name: 上传 Release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Oplus-Assistant-Hook-Release
      #     path: app/build/outputs/apk/release/app-release.apk
